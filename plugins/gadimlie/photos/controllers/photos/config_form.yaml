# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Photo

# Model Form Field configuration
form: $/gadimlie/photos/models/photo/fields.yaml

# Model Class name
modelClass: Gadimlie\Photos\Models\Photo

# Default redirect location
defaultRedirect: gadimlie/photos/photos

# Create page
create:
    title: Create Photo
    redirect: gadimlie/photos/photos/update/:id
    redirectClose: gadimlie/photos/photos

# Update page
update:
    title: Edit Photo
    redirect: gadimlie/photos/photos
    redirectClose: gadimlie/photos/photos

# Preview page
preview:
    title: Preview photos
