# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true
    title:
        label: Başlıq
        span: storm
        cssClass: col-md-12
        required: true
    type:
        label: Media növü
        type: dropdown
        span: storm
        cssClass: col-md-6
        options:
            photo: Foto
            video: Video
    section: 
        label: İstifadə olunacaq bölmə
        type: dropdown
        span: storm
        cssClass: col-md-6
        options:
            pr: İctimaiyyətlə əlaqələr
            bsp: Balaxanı Sənayə Parkı
            tss: Tullantıdan sənətə sərgisi

    video:
        type: repeater
        label: Video 
        prompt: Video əlavə et
        form:
            fields:
                title:
                    label: Videonun başlıqı
                video:
                    label: Video linki


    gallery:
        label: Galareya
        type: repeater
        prompt: Şəkil əlavə et
        form:
            fields:
                title:
                    label: Şəkilin adı
                photo:
                    type: mediafinder
                    label: Şəkil

                    


    