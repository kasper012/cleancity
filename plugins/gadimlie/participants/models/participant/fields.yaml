# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true

    name:
        label: İştirakçının adı
        span: storm
        cssClass: col-md-6
   
    profile_img:
        label: İştirakçı şəkili
        type: mediafinder
        span: storm
        cssClass: col-md-6


    video: 
            label: Video link
            span: storm
            cssClass: col-md-12
            placeholder: https://www.youtube.com/embed/
            comment: Youtube linki 'https://www.youtube.com/embed/'-dan başlamalıdı
    video_title:
            label: Video başlıqı
            span: storm
            cssClass: col-md-12
    year:
        label: Sərgi ili
        span: storm
        cssClass: col-md-3
        type: checkboxlist
        size: auto
        options:
            2012: 2012
            2013: 2013
            2014: 2014
            2015: 2015
            2016: 2016
            2017: 2017
            2018: 2018
            2019: 2019
            2020: 2020
            2021: 2021
            2022: 2022
            2023: 2023
            2024: 2024
            2025: 2025
            2026: 2026
            2027: 2027
            2028: 2028
            2029: 2029
            2030: 2030


         
    images: 
            label: Galereya
            type: repeater
            span: storm
            cssClass: col-md-9
            stretch: true
            
            prompt: Qalereyaya şəkil əlavə et
            form:
                fields:
                    image: 
                        label: Şəkil
                        type: mediafinder
                    image_description:
                        label: Şəkilin adı





