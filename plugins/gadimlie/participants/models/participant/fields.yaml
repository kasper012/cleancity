# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true

    name:
        label: İştirakçının adı
        span: storm
        cssClass: col-md-6
        required: true
   
    profile_img:
        label: İştirakçı şəkili
        type: mediafinder
        span: storm
        cssClass: col-md-6
        required: true
        comment: Tövsiyə olunan ölçülər - 1x1.41 (məsələn, 210x297 və ya 800x1128)


    video: 
            label: Video link
            span: storm
            cssClass: col-md-12
            placeholder: https://www.youtube.com/embed/
            comment: Youtube linki 'https://www.youtube.com/embed/'-dan başlamalıdı
    video_title:
            label: Video başlıqı
            span: storm
            cssClass: col-md-12
    year:
        label: Sərgi ili
        required: true
        span: storm
        cssClass: col-md-3
        type: checkboxlist
        size: auto
        options:
            2012: 2012
            2013: 2013
            2014: 2014
            2015: 2015
            2016: 2016
            2017: 2017
            2018: 2018
            2019: 2019
            2020: 2020
            2021: 2021
            2022: 2022
            2023: 2023
            2024: 2024
            2025: 2025
            2026: 2026
            2027: 2027
            2028: 2028
            2029: 2029
            2030: 2030


         
    images: 
            label: Galereya
            required: true
            type: repeater
            span: storm
            cssClass: col-md-9
            stretch: true
            
            prompt: Qalereyaya şəkil əlavə et
            form:
                fields:
                    image: 
                        label: Şəkil
                        type: mediafinder
                        comment: Tövsiyə olunan ölçülər - 3x2 (məsələn, 1500x1000 və ya 3000x2000)
                    image_description:
                        label: Şəkilin adı
                    concept:
                        label: Konsepsiya





