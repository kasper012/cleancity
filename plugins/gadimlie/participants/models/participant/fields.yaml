#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true

    name:
        label: İştirakçının adı
        span: storm
        cssClass: col-md-4
   
    profile_img:
        label: İştirakçı şəkili
        type: mediafinder
        span: storm
        cssClass: col-md-4
        
    year:
        label: Sərgi ili
        span: storm
        cssClass: col-md-4
        type: dropdown
        options:
            2012: 2012
            2013: 2013
            2014: 2014
            2015: 2015
            2016: 2016
            2017: 2017
            2018: 2018
            2019: 2019
            2020: 2020
            2021: 2021
            2022: 2022
            2023: 2023
            2024: 2024
            2025: 2025
            2026: 2026
            2027: 2027
            2028: 2028
            2029: 2029
            2030: 2030
 
    images: 
            label: Galereya
            type: repeater
            
            prompt: Qalereyaya şəkil əlavə et
            form:
                fields:
                    image: 
                        label: Şəkil
                        type: mediafinder
                    image_description:
                        label: Şəkilin adı
    

