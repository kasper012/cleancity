# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Tender

# Model Form Field configuration
form: $/gadimlie/tenders/models/tender/fields.yaml

# Model Class name
modelClass: Gadimlie\Tenders\Models\Tender

# Default redirect location
defaultRedirect: gadimlie/tenders/tenders

# Create page
create:
    title: Yeni Tender
    redirect: gadimlie/tenders/tenders/update/:id
    redirectClose: gadimlie/tenders/tenders

# Update page
update:
    title: Tenderi dəyişmək
    redirect: gadimlie/tenders/tenders
    redirectClose: gadimlie/tenders/tenders

# Preview page
preview:
    title: Tenderi göstərmək
