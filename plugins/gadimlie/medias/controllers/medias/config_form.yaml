# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Media

# Model Form Field configuration
form: $/gadimlie/medias/models/media/fields.yaml

# Model Class name
modelClass: Gadimlie\Medias\Models\Media

# Default redirect location
defaultRedirect: gadimlie/medias/medias

# Create page
create:
    title: Yeni Media
    redirect: gadimlie/medias/medias/update/:id
    redirectClose: gadimlie/medias/medias

# Update page
update:
    title: Mediani dəyişmək
    redirect: gadimlie/medias/medias
    redirectClose: gadimlie/medias/medias

# Preview page
preview:
    title: Mediani göstərmək
