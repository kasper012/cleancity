<li class="nav-item dropdown language-switcher">
    <a class="nav-link dropdown-toggle" href="javascript:void(0);"  role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">{{ activeLocale | upper }}</a>
    <ul class="dropdown-menu" >
        {% for code, name in locales %}
            {% if activeLocale != code %}
                <li><a href="{{''|app}}{{ '/' ~ code ~ localeLinks[code] }}">{{ code | upper }}</a></li>
            {% endif %}
        {% endfor %}
    </ul>
 </li>
