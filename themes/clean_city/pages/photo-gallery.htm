title = "Foto Galereya"
url = "/foto-galereya"
layout = "default"
is_hidden = 0

[photos]

[viewBag]
localeTitle[en] = "Photo Gallery"
localeUrl[en] = "/photo-gallery"
==
{% partial 'inner_header' %}
<div class="gramotech-content">
  <div class="gramotech-content-area">
    <div data-elementor-type="wp-page" data-elementor-id="2834" class="elementor elementor-2834"
      data-elementor-settings="[]">
      <div class="elementor-inner">
        <div class="elementor-section-wrap">
          <section
            class="elementor-section elementor-top-section elementor-element elementor-element-210c5fd elementor-section-boxed elementor-section-height-default elementor-section-height-default"
            data-id="210c5fd" data-element_type="section">
            <div class="elementor-container elementor-column-gap-default">
              <div class="elementor-row">
                <div
                  class="elementor-column elementor-col-100 elementor-top-column elementor-element elementor-element-43e5240"
                  data-id="43e5240" data-element_type="column">
                  <div class="elementor-column-wrap elementor-element-populated">
                    <div class="elementor-widget-wrap">
                      <div
                        class="elementor-element elementor-element-4992405 elementor-widget elementor-widget-gallery-listing"
                        data-id="4992405" data-element_type="widget" data-widget_type="gallery-listing.default">
                        <div class="elementor-widget-container">
                          <div class="gallery wf100">
                            <div class="row">
                              {% for photo in photos %}
                              <!--Image Box Start-->
                              <div class="col-md-4 col-sm-4">
                                <div class="gallery-img">
                                  <a href="{{ 'foto-galereya' | page({id: photos.id}) }}"
                                    ><i class="fas fa-search"></i></a>
                                  <img width="360" height="291" src="{{ photo.photo }}"
                                    class="attachment-gramotech-posts-list size-gramotech-posts-list wp-post-image"
                                    alt="" loading="lazy" />
                                  <h3>{{ photo.title }}</h3>
                                </div>
                              </div>
                              {% endfor %}
                            </div>
                            <div class="row">
                              <div class="col-md-12">
                                <div class="gt-pagination">
                                  <nav>
                                    <ul class="pagination">
                                      <li><span aria-current="page" class="page-numbers current">1</span>
                                        <a class="page-numbers" href="gallery-grid/page/2/index.html">2</a>
                                        <a class="page-numbers" href="gallery-grid/page/3/index.html">3</a>
                                        <a class="next page-numbers" href="gallery-grid/page/2/index.html"><i
                                            class="fas fa-angle-right"></i></a>
                                      </li>
                                    </ul>
                                  </nav>
                                </div>
                              </div>
                            </div>

                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
