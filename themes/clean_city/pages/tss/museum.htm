title = "TSS Muzeyi"
url = "/tss/muzey"
layout = "main"
is_hidden = 0

[viewBag]
localeTitle[en] = "WA Museum "
localeUrl[en] = "/fwta/museum"
==
{% partial 'sections/breadcrumbs'
    parents=[
            {
                'title': ('TSS' | _),
                'link': ''
            }
        ] 
%}
<section class="wf100 p80 blog">
    <div class="blog-details">
        <div class="container">
            <div class="row">
                <div class="col-lg-9 col-md-8">
                    <!--Blog Single Content Start-->
                    <div class="blog-single-content">

                        {% content 'museum' %}
                    </div>
                </div>

                <div class="col-lg-3 col-md-4">
                    {% partial 'sidebars/tss' %}
                </div>

            </div>
        </div>
    </div>
</section>
