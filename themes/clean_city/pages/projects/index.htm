title = "Layihələr"
url = "/layiheler"
layout = "main"
is_hidden = 0

[viewBag]
localeTitle[en] = "Projects"
localeUrl[en] = "/projects"
==
{% partial 'sections/breadcrumbs' %}

<section class="wf100 p80 blog">
    <div class="projects-grid">
       <div class="container">
          <div class="row">
              {% for project in projects %}
                <div class="col-md-4 col-sm-6">
                    <!--campaign box start-->
                    <div class="ser-box">
                    <div class="ser-thumb" style="background-image: url({{ project.image | media }})">
                        <a href="{{ 'projects/detailed' | page({id: project.id}) }}"><i class="fas fa-link"></i></a>
                    </div>
                    <div class="ser-txt">
                        <h5> <a href="{{ 'projects/detailed' | page({id: project.id}) }}">{{ project.title }}</a> </h5>
                        <a href="{{ 'projects/detailed' | page({id: project.id}) }}"><span class="aicon"><i class="fas fa-arrow-right"></i></span> </a>
                    </div>
                    </div>
                    <!--campaign box end--> 
                </div>
             {% endfor %}
          </div>
       </div>
    </div>
 </section>
