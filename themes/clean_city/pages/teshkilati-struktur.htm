is_hidden = 0

[Company]

{% partial 'inner_header' %}

<div class="gramotech-content">
  <div class="gramotech-content-area">
    <div data-elementor-type="wp-page" data-elementor-id="2871" class="elementor elementor-2871"
      data-elementor-settings="[]">
      <div class="elementor-inner">
        <div class="elementor-section-wrap">
          <section
            class="elementor-section elementor-top-section elementor-element elementor-element-ba3ff9e elementor-section-boxed elementor-section-height-default elementor-section-height-default"
            data-id="ba3ff9e" data-element_type="section">
            <div class="elementor-container elementor-column-gap-default">
              <div class="elementor-row">
                <div
                  class="elementor-column elementor-col-100 elementor-top-column elementor-element elementor-element-f85ecff"
                  data-id="f85ecff" data-element_type="column">
                  <div class="elementor-column-wrap elementor-element-populated">
                    <div class="elementor-widget-wrap">
                      <div
                        class="elementor-element elementor-element-11be30a elementor-widget elementor-widget-team-listing"
                        data-id="11be30a" data-element_type="widget" data-widget_type="team-listing.default">
                        <div class="elementor-widget-container">
                          <div class="team-grid team-small-grid">
                            <div class="row">
                              <div class="col-md-12">
                                <h1>Təşkilati struktur</h1>
                              </div>
                              <!--Team Box Start-->
                                                {% for person in company.structure_person %}
                              <div class="col-md-6 col-xs-12">
                                <div class="team-box">
                                  <img width="360" height="490" src="{{ person.photo | media }}"
                                    class="attachment-gramotech-projects-grid size-gramotech-projects-grid wp-post-image"
                                    alt="" loading="lazy"/>
                                  <div class="team-info">
                                    <h5><a href="index.html@p=705.html">{{ person.name }}</a></h5>
                                    <p></p>
                                    <ul>
                                      <li>{{ person.post}}</li>
                                    </ul>
                                  </div>
                                </div>
                              </div>
                              {% endfor %}
                            </div>
                            <br>
                            <img src="{{ company.structure_image | media }}" alt="">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  {% partial 'about_sidebar' %}
                </div>
              </div>
            </div>
          </section>

        </div>
      </div>
    </div>
  </div>
</div>
